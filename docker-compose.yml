# docker compose up  →  Postgres + the Waypoint One API and web app, seeded with the S1 delivery day.
# Open http://localhost:8080 (or the PORT you set in .env).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-waypoint}:${POSTGRES_PASSWORD:-waypoint}@db:5432/${POSTGRES_DB:-waypoint}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-waypoint@mr2026}
      SEED_PIN: ${SEED_PIN:-waypoint@mr2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
